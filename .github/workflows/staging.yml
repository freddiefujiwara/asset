name: Deploy Staging Preview

on:
  push:
    branches-ignore: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: staging-preview
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - run: npm install
    - run: npm test -- --run
    - run: npm run build:staging
      env:
        VITE_GAS_ENDPOINT: "https://script.google.com/macros/s/AKfycbwaNgQjqAJCOKt8ReWAE6uhEZzEBuRRsnRbRFsa16RpVQSs6KSRVCPNZnalOXZWy0CE/exec"
        VITE_STAGING: "1"
        VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
    - name: Deploy staging preview to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: <redacted>
        publish_dir: ./dist-staging
        destination_dir: staging
        keep_files: true
