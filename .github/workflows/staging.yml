name: Deploy Staging Preview

on:
  push:
    branches-ignore: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: staging-preview
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js 20.x
      uses: actions/setup-node@v7
      with:
        node-version: '24'
    - run: npm install
    - run: npm test -- --run
    - run: npm run build:staging
      env:
        VITE_GAS_ENDPOINT: "https://script.google.com/macros/s/AKfycbwaNgQjqAJCOKt8ReWAE6uhEZzEBuRRsnRbRFsa16RpVQSs6KSRVCPNZnalOXZWy0CE/exec"
        VITE_STAGING: "1"
        VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
    - name: Deploy staging preview to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./dist-staging
        destination_dir: staging
        keep_files: true

  e2e:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: npm ci
      - name: Wait for the preview to be published
        run: sleep 60
      - name: Check the staging preview in a real browser
        env:
          HOME: /root
          APP: asset
        run: npx playwright test e2e/staging.check.js
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore
