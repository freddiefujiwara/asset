name: Asset dashboard parity

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Monday 09:23 JST: catch changes made only in asset-gas.
    - cron: '23 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: freddiefujiwara/asset-gas
          ref: main
          path: asset-gas-source
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Compare both implementations with the same fixtures
        env:
          TZ: Asia/Tokyo
          ASSET_GAS_SOURCE: ${{ github.workspace }}/asset-gas-source/src/Code.js
        run: npx --no-install vitest run tests/recent-expenses-parity.test.js tests/headline-parity.test.js
